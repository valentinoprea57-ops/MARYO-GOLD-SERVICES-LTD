<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryo Gold Services LTD | Executive Private Hire & Airport Transfers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: linear-gradient(rgba(11, 15, 25, 0.88), rgba(11, 15, 25, 0.94)),
                        url('https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            color: #f8fafc; 
            line-height: 1.6; 
            min-height: 100vh;
        }
        
        header { 
            background: rgba(2, 6, 23, 0.85); 
            padding: 1.2rem 1.5rem; 
            border-bottom: 1px solid rgba(234, 179, 8, 0.2); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 1100px; 
            margin: 0 auto; 
            flex-wrap: wrap; 
            gap: 0.75rem; 
            backdrop-filter: blur(10px);
            border-radius: 0 0 12px 12px;
        }
        .logo { font-size: 1.2rem; font-weight: 700; color: #eab308; text-transform: uppercase; letter-spacing: 1px; }
        .header-contacts { display: flex; gap: 0.5rem; align-items: center; }
        .contact-chip { background: rgba(30, 41, 59, 0.8); color: #cbd5e1; padding: 0.45rem 0.9rem; border-radius: 9999px; text-decoration: none; font-size: 0.82rem; border: 1px solid #334155; }
        .phone-btn { background: #22c55e; color: #fff; padding: 0.5rem 1rem; border-radius: 9999px; text-decoration: none; font-weight: 600; font-size: 0.85rem; }
        
        .hero { text-align: center; padding: 4rem 1.5rem 2.5rem; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 2.3rem; margin-bottom: 1rem; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .hero p { color: #cbd5e1; font-size: 1.15rem; text-shadow: 0 1px 5px rgba(0,0,0,0.5); }

        .section { max-width: 1000px; margin: 2.5rem auto; padding: 0 1.5rem; }
        .section h2 { text-align: center; font-size: 1.7rem; margin-bottom: 1.8rem; color: #eab308; letter-spacing: 0.5px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; }
        .card { 
            background: rgba(19, 29, 49, 0.85); 
            padding: 1.6rem; 
            border-radius: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .card h3 { margin-bottom: 0.5rem; font-size: 1.2rem; color: #fff; }
        .card p { color: #94a3b8; font-size: 0.92rem; }

        /* Booking Section */
        .booking-box { 
            background: rgba(19, 29, 49, 0.9); 
            padding: 2.2rem; 
            border-radius: 16px; 
            border: 1px solid rgba(234, 179, 8, 0.25); 
            max-width: 650px; 
            margin: 0 auto; 
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        .sub-header { font-size: 0.95rem; font-weight: 700; color: #eab308; text-transform: uppercase; margin-bottom: 0.75rem; letter-spacing: 0.5px; }

        /* Step 1: Calendar */
        .date-input-wrap { margin-bottom: 2rem; }
        .date-input-wrap input[type="date"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0b0f19;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            outline: none;
            color-scheme: dark;
        }

        /* Step 2: Time Slots Grid (00:00 - 23:00) */
        .slots-container { margin-bottom: 2rem; }
        .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.55rem; }
        @media (max-width: 480px) {
            .slots-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .slot-btn {
            background: rgba(11, 15, 25, 0.8);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.7rem 0.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .slot-btn:hover:not(.booked) { border-color: #eab308; color: #fff; }
        .slot-btn.active { background: #10b981; border-color: #10b981; color: #fff; }
        .slot-btn.booked {
            background: rgba(30, 41, 59, 0.5);
            border-color: #1e293b;
            color: #475569;
            text-decoration: line-through;
            cursor: not-allowed;
            opacity: 0.35;
        }

        /* Step 3: Contact Details */
        .form-group { margin-bottom: 1.1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-size: 0.85rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #334155; background: #0b0f19; color: #fff; font-size: 0.95rem; }
        .form-group input:focus { border-color: #eab308; outline: none; }

        .btn-submit {
            background: #eab308;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.05rem;
            width: 100%;
            padding: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #ca8a04; }
